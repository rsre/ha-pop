ha_panel_wake:
  alias: Wake wall panel
  icon: mdi:tablet-dashboard
  mode: restart
  sequence:
    - action: rest_command.ha_panel_wake
      response_variable: panel_response
    - if: "{{ panel_response.status != 200 }}"
      then:
        - stop: Panel wake failed
          error: true
ha_panel_doorbell:
  alias: Show doorbell on wall panel
  icon: mdi:doorbell-video
  mode: restart
  sequence:
    - action: script.ha_panel_wake
    - action: input_button.press
      target:
        entity_id: input_button.ha_panel_doorbell
ha_panel_sleep:
  alias: Sleep wall panel
  icon: mdi:power-sleep
  mode: restart
  sequence:
    - action: rest_command.ha_panel_sleep
      response_variable: panel_response
    - if: "{{ panel_response.status != 200 }}"
      then:
        - stop: Panel sleep failed
          error: true
