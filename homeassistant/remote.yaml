# Home Assistant package; shared authorization lives in secrets.yaml.
rest_command:
  ha_panel_wake:
    url: http://192.0.2.10:8765/wake
    method: POST
    headers:
      Authorization: !secret ha_panel_authorization
    timeout: 10

  ha_panel_sleep:
    url: http://192.0.2.10:8765/sleep
    method: POST
    headers:
      Authorization: !secret ha_panel_authorization
    timeout: 10

input_button:
  ha_panel_doorbell:
    name: Panel doorbell popup
    icon: mdi:doorbell-video
